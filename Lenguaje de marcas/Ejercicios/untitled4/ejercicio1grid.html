<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<style>
  div {
    border: 1px solid black;
  }
  * {
    margin: 10px;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    background-color: #f5f5f5;
  }
  .contenedor {
    display: grid;
    grid-template-columns: 1fr 1fr ;
    gap: 1rem;
  }


</style>
</head>
<body>
<div class="contenedor">
  <div id="uno">Uno</div>
  <div id="dos">Dos</div>
  <div id="tres">Tres</div>
  <div id="cuatro">Cuatro</div>
</div>

</body>
</html>
